# general settings
name: ssai3d_finetune
model_type: ImageRestorationModel
scale: 1
num_gpu: 1
manual_seed: 10

datasets:
  train:
    name: semi-synthetic
    type: PairedImageDataset
    dataroot_gt: ~  # set by ssai3d.train.finetune
    dataroot_lq: ~

    filename_tmpl: '{}'
    io_backend:
      type: disk

    gt_size: 500
    use_flip: true
    use_rot: true

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 1
    dataset_enlarge_ratio: 1
    prefetch_mode: ~
    

network_g:
  type: NAFNetLocal
  width: 64
  enc_blk_nums: [1, 1, 1, 28]
  middle_blk_num: 1
  dec_blk_nums: [1, 1, 1, 1]
  
# path
path:
  pretrain_network_g: ~  # set by the caller
  strict_load_g: true
  resume_state: ~

# training settings
train:
  optim_g:
    type: AdamW
    lr: !!float 1e-4
    weight_decay: !!float 1e-5
    betas: [0.9, 0.9]

  scheduler:
    type: TrueCosineAnnealingLR
    T_max: 1000
    eta_min: !!float 1e-7

  total_iter: 1000
  warmup_iter: -1 # no warm up

  # losses
  pixel_opt:
    type: PSNRLoss
    loss_weight: 1
    reduction: mean

# inference settings
val:
  save_img: false

# logging settings
logger:
  print_freq: 200
  save_checkpoint_freq: !!float 500
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: none
  port: 29500
